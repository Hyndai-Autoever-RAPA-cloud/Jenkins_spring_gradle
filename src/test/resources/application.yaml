spring:
  application:
    name: jenkinsgradle
  datasource:
    url: jdbc:h2:mem:jenkinsgradle;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  port: 8082
